name: Node.js CI

on:
  push:
    branches: [ main, ci/** ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Jest artifacts
        uses: actions/cache@v3
        with:
          path: |
            .jest-cache
            coverage
            node_modules/.cache
          key: ${{ runner.os }}-jest-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.test.js') }}
          restore-keys: |
            ${{ runner.os }}-jest-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-jest-

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci --prefer-offline; else npm install; fi

      - name: Lint
        run: npm run -s lint || true

      - name: Run tests (CI mode)
        env:
          CI: 'true'
          NODE_ENV: 'test'
        run: npm test --silent
